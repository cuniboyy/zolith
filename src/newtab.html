<!doctype html>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  :root { color-scheme: dark }
  html { height: 100% }
  body {
    margin: 0; min-height: 100%; box-sizing: border-box; padding: 14vh 0 40px;
    font: 15px system-ui, sans-serif; background: #1c1b22; color: #fbfbfe;
    /* top-aligned, not centred: a short window scrolls instead of cutting off the heading */
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 28px;
  }
  h1 { font-weight: 300; font-size: 36px; margin: 0 }
  form { width: min(640px, 86vw) }
  input {
    width: 100%; box-sizing: border-box; font: inherit; padding: 14px 18px;
    border: 2px solid transparent; border-radius: 8px; background: #2b2a33; color: inherit;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .5); outline: none;
  }
  input:focus { border-color: #00ddff }
  #top { display: grid; grid-template-columns: repeat(4, 104px); gap: 14px; margin-top: 4px }
  #top:empty { display: none }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 104px; padding: 12px 6px 10px;
    border-radius: 12px; color: inherit; text-decoration: none; font-size: 12px }
  .tile:hover { background: #2b2a33 }
  .tile .badge { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    font-size: 20px; font-weight: 600; color: #fff }
  .tile .badge img { width: 28px; height: 28px; object-fit: contain }
  .tile .name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cfcfd8 }
  @media (max-width: 560px) { #top { grid-template-columns: repeat(2, 104px) } }
</style>
<h1>Zolith</h1>
<form id="f">
  <input name="q" placeholder="Search the web" autofocus autocomplete="off">
</form>
<div id="top"></div>
<script>
  // __SEARCH__ is replaced by the browser with the chosen engine's URL template
  const template = __SEARCH__;
  // __TOP__ is the most-visited sites: [[address, title], ...]
  const TOP = __TOP__;
  const hue = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  for (const [url, title] of TOP) {
    let host = url;
    try { host = new URL(url).host.replace(/^www\./, ''); } catch (e) {}
    const a = document.createElement('a');
    a.className = 'tile'; a.href = url; a.title = title || host; a.dataset.url = url;
    const badge = document.createElement('div');
    badge.className = 'badge'; badge.textContent = host.charAt(0).toUpperCase();
    badge.style.background = 'hsl(' + hue(host) + ' 45% 38%)';
    const name = document.createElement('div');
    name.className = 'name'; name.textContent = (title && title.length < 40 ? title : host);
    a.append(badge, name);
    document.getElementById('top').append(a);
  }
  // the browser calls this with each site's icon once it has it; until then the letter shows
  window.zolithIcon = (url, src) => {
    for (const t of document.querySelectorAll('.tile')) {
      if (t.dataset.url !== url) continue;
      const img = new Image();
      img.onload = () => { const b = t.querySelector('.badge'); b.textContent = ''; b.style.background = '#e8eaed'; b.append(img); };
      img.src = src;
    }
  };
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = e.target.q.value.trim();
    if (q) location.href = template.split('%s').join(encodeURIComponent(q));
  });
</script>
