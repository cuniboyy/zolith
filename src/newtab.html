<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<style>
  :root { color-scheme: dark; --bg: #17151a; --panel: #252129; --text: #f6f2f6; --muted: #aaa2ad; --accent: #fa3158 }
  * { box-sizing: border-box }
  html { min-height: 100% }
  body {
    position: relative; isolation: isolate; overflow-x: hidden; margin: 0; min-height: 100vh; padding: 12vh 24px 48px;
    display: flex; flex-direction: column; align-items: center; gap: 22px;
    color: var(--text); background: var(--bg); font: 15px/1.5 system-ui, sans-serif;
  }
  body::before, body::after { content: ""; position: fixed; z-index: -1; pointer-events: none; border-radius: 50%; filter: blur(2px) }
  body::before { width: 560px; height: 480px; top: -240px; left: calc(50% - 280px); background: radial-gradient(ellipse, rgba(189, 34, 67, .16), transparent 68%) }
  body::after { width: 500px; height: 400px; right: -320px; bottom: -220px; background: radial-gradient(ellipse, rgba(104, 63, 86, .12), transparent 70%) }
  .intro { text-align: center; animation: rise .65s cubic-bezier(.2,.8,.2,1) both }
  .mark { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto 14px; border: 1px solid rgba(255,255,255,.1); border-radius: 16px;
    color: #fff; background: linear-gradient(145deg, #ff607b, #c41f45); box-shadow: 0 8px 28px rgba(211, 35, 74, .23); font-size: 24px; font-weight: 750 }
  h1 { margin: 0; font-size: clamp(30px, 4vw, 38px); font-weight: 560; letter-spacing: -.045em }
  .tagline { margin: 5px 0 0; color: var(--muted); font-size: 14px }
  form { position: relative; width: min(620px, 88vw); animation: rise .7s .06s cubic-bezier(.2,.8,.2,1) both }
  form svg { position: absolute; top: 50%; left: 19px; width: 20px; height: 20px; transform: translateY(-50%); fill: none; stroke: #929baa; stroke-width: 1.8; pointer-events: none }
  input {
    display: block; width: 100%; height: 58px; padding: 0 20px 0 52px; border: 1px solid rgba(255,255,255,.08); border-radius: 16px;
    color: var(--text); background: rgba(37,33,41,.92); box-shadow: 0 12px 32px rgba(0,0,0,.22), inset 0 1px rgba(255,255,255,.025);
    outline: none; font: inherit; font-size: 15px; transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  input::placeholder { color: #8e96a4 }
  input:hover { background: #302b34 }
  input:focus { border-color: rgba(250,49,88,.78); box-shadow: 0 0 0 4px rgba(250,49,88,.11), 0 14px 36px rgba(0,0,0,.28) }
  .section-label { width: min(620px, 88vw); margin: 10px 0 -12px; color: #858e9c; font-size: 11px; font-weight: 650; letter-spacing: .13em; text-transform: uppercase; animation: rise .65s .1s both }
  #top { display: grid; width: min(620px, 88vw); grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; animation: rise .7s .12s cubic-bezier(.2,.8,.2,1) both }
  #top:empty { display: none }
  .tile {
    display: flex; min-width: 0; min-height: 116px; flex-direction: column; align-items: center; justify-content: center; gap: 11px; padding: 16px 8px 13px;
    border: 1px solid transparent; border-radius: 16px; color: inherit; text-decoration: none; font-size: 12px;
    animation: tile-in .45s both; animation-delay: calc(140ms + var(--i, 0) * 55ms);
    transition: background .2s ease, border-color .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .tile:hover { transform: translateY(-4px); border-color: rgba(255,255,255,.07); background: rgba(43,38,47,.88); box-shadow: 0 12px 24px rgba(0,0,0,.16) }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
  .tile .badge { width: 48px; height: 48px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.13); border-radius: 15px;
    color: white; box-shadow: 0 5px 14px rgba(0,0,0,.18); font-size: 20px; font-weight: 650 }
  .tile .badge img { width: 28px; height: 28px; object-fit: contain }
  .tile .name { max-width: 100%; overflow: hidden; color: #c5cbd5; text-overflow: ellipsis; white-space: nowrap }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes tile-in { from { opacity: 0; transform: translateY(8px) scale(.97) } to { opacity: 1; transform: translateY(0) scale(1) } }
  @media (max-width: 560px) {
    body { padding-top: 10vh }
    #top { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 340px }
    .tile { min-height: 106px }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important }
  }
</style>
<div class="intro">
  <div class="mark" aria-hidden="true">Z</div>
  <h1>Zolith</h1>
  <p class="tagline">A quieter place to browse.</p>
</div>
<form id="f" role="search">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"></circle><path d="m16 16 4.3 4.3"></path></svg>
  <input name="q" placeholder="Search the web or enter an address" autofocus autocomplete="off" aria-label="Search the web or enter an address">
</form>
<div class="section-label">Your shortcuts</div>
<div id="top"></div>
<script>
  // __SEARCH__ is replaced by the browser with the chosen engine's URL template
  const template = __SEARCH__;
  // __TOP__ is the most-visited sites: [[address, title], ...]
  const TOP = __TOP__;
  if (!TOP.length) document.querySelector('.section-label').hidden = true;
  const hue = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  for (const [i, [url, title]] of TOP.entries()) {
    let host = url;
    try { host = new URL(url).host.replace(/^www\./, ''); } catch (e) {}
    const a = document.createElement('a');
    a.className = 'tile'; a.href = url; a.title = title || host; a.dataset.url = url; a.style.setProperty('--i', i);
    const badge = document.createElement('div');
    badge.className = 'badge'; badge.textContent = host.charAt(0).toUpperCase();
    badge.style.background = 'hsl(' + hue(host) + ' 43% 36%)';
    const name = document.createElement('div');
    name.className = 'name'; name.textContent = (title && title.length < 40 ? title : host);
    a.append(badge, name);
    document.getElementById('top').append(a);
  }
  // the browser calls this with each site's icon once it has it; until then the letter shows
  window.zolithIcon = (url, src) => {
    for (const t of document.querySelectorAll('.tile')) {
      if (t.dataset.url !== url) continue;
      const img = new Image();
      img.onload = () => { const b = t.querySelector('.badge'); b.textContent = ''; b.style.background = '#e8eaed'; b.append(img); };
      img.src = src;
    }
  };
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = e.target.q.value.trim();
    if (q) location.href = template.split('%s').join(encodeURIComponent(q));
  });
</script>
